name: MariteConnect
options:
  bundleIdPrefix: com.marite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc.git
    from: 1.2.0

targets:
  MariteConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/MariteConnect
    resources:
      - path: Sources/MariteConnect/Resources/Assets.xcassets
    dependencies:
      - package: MSAL
        product: MSAL
    info:
      path: Sources/MariteConnect/Resources/Info.plist
      properties:
        CFBundleDisplayName: Marite Connect
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # MSAL requires an ADAL/MSAL redirect URI scheme registered here and in Entra ID.
        # Replace MSAL_CLIENT_ID below with the Application (client) ID from your
        # Entra ID app registration (see docs/SETUP.md).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "msauth.com.marite.MariteConnect"
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSFaceIDUsageDescription: "Marite Connect uses Face ID to quickly and securely unlock the app."
    entitlements:
      path: Sources/MariteConnect/Resources/MariteConnect.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marite.MariteConnect
        DEVELOPMENT_TEAM: "" # fill in with your Apple Developer Team ID
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    schemes:
      MariteConnect:
        build:
          targets:
            MariteConnect: all
        run:
          config: Debug
        archive:
          config: Release
