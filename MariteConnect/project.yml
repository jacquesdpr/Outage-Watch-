name: MariteConnect
options:
  bundleIdPrefix: com.marite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MariteConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/MariteConnect
    resources:
      - path: Sources/MariteConnect/Resources/Assets.xcassets
    info:
      path: Sources/MariteConnect/Resources/Info.plist
      properties:
        CFBundleDisplayName: Marite Connect
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Sources/MariteConnect/Resources/MariteConnect.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marite.MariteConnect
        DEVELOPMENT_TEAM: "" # fill in with your Apple Developer Team ID
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    schemes:
      MariteConnect:
        build:
          targets:
            MariteConnect: all
        run:
          config: Debug
        archive:
          config: Release
