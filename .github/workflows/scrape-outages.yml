name: Scrape OurPower outage data

# Schedule disabled until the scraper's status-detection patterns are
# confirmed accurate against the live site — its first run misclassified
# every area as "planned outage" from what looks like generic page/nav
# text rather than actual status. Manual (workflow_dispatch) runs only
# for now.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/scrape_ourpower.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Auto-update outage data from OurPower.co.za"
          git push
